name: setup

# Whether one command brings a machine to a working install, on a machine that
# is not the one it was written on. Everything here has failed for real: a
# Windows upgrade needed manual cleanup, and a Linux container found five
# reasons, four of them in this repo.
#
# The runners are deliberately bare. They have node and nothing else configured
# -- no PNPM_HOME, no pi, no credentials -- which is the state a new machine is
# in and the state that kept breaking.

# Every push. bootstrap runs the whole test suite, so any package can be the
# one that breaks it -- the first version of this filtered to the setup scripts
# and then missed a timing assertion that only failed on Windows.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm is the user's to install: setup.mjs reports it missing and stops,
      # which is checked below before this step would have run.
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      # Written in node rather than shell: on Windows the runner's bash is Git
      # Bash, whose $HOME is a /c/... path that pnpm and cmd.exe do not accept.
      # node reports the platform's own form on every runner.
      - name: PNPM_HOME on PATH
        run: |
          node -e "
            const { homedir } = require('node:os');
            const { join } = require('node:path');
            const { mkdirSync, appendFileSync } = require('node:fs');
            const home = join(homedir(), '.pnpm-global');
            mkdirSync(home, { recursive: true });
            appendFileSync(process.env.GITHUB_ENV, 'PNPM_HOME=' + home + '\n');
            appendFileSync(process.env.GITHUB_PATH, home + '\n');
            console.log('PNPM_HOME=' + home);
          "

      - name: bootstrap
        working-directory: agent/extensions
        run: node scripts/setup.mjs bootstrap

      - name: the machine now matches the repo
        working-directory: agent/extensions
        run: node scripts/setup.mjs check

      # Also node: `pi` is a .cmd shim on Windows, which bash can start but
      # execFile cannot, and the checks below have to run identically everywhere.
      - name: pi runs at the pinned version, and only one is unpacked
        working-directory: agent/extensions
        run: |
          node -e "
            const { execFileSync } = require('node:child_process');
            const { readFileSync, readdirSync } = require('node:fs');
            const windows = process.platform === 'win32';
            const run = (cmd, args) => execFileSync(
              windows ? process.env.ComSpec ?? 'cmd.exe' : cmd,
              windows ? ['/d', '/s', '/c', cmd, ...args] : args,
              { encoding: 'utf-8' },
            ).trim();

            const yaml = readFileSync('pnpm-workspace.yaml', 'utf-8');
            const pinned = /"@earendil-works\/pi-coding-agent":\s*(\S+)/.exec(yaml)[1];
            const installed = run('pi', ['--version']);
            console.log('pinned ' + pinned + ', installed ' + installed);
            if (pinned !== installed) throw new Error('pi on PATH is not the pinned version');

            const store = readdirSync('node_modules/.pnpm');
            for (const pkg of ['pi-coding-agent', 'pi-tui', 'pi-ai']) {
              const found = [...new Set(store
                .filter((e) => e.startsWith('@earendil-works+' + pkg + '@'))
                .map((e) => e.split('@').pop().split('_')[0]))];
              console.log(pkg + ': ' + found.join(', '));
              if (found.length !== 1 || found[0] !== pinned) {
                throw new Error(pkg + ' has ' + found.length + ' versions unpacked');
              }
            }
          "

  refuses-a-machine-it-cannot-fix:
    # node and pnpm are the user's to configure. The script has to say so and
    # stop, rather than fail somewhere further in with a message about an
    # internal condition.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: says what is wrong when pnpm is missing
        working-directory: agent/extensions
        run: |
          output="$(node scripts/setup.mjs bootstrap 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -q "pnpm is not on PATH"
          echo "$output" | grep -q "corepack enable"

      - name: says what is wrong when the global bin directory is not on PATH
        working-directory: agent/extensions
        run: |
          corepack enable && corepack prepare pnpm@10.13.1 --activate
          export PNPM_HOME="$HOME/.pnpm-global"
          mkdir -p "$PNPM_HOME/bin"
          export PATH="$PNPM_HOME/bin:$PATH"
          output="$(node scripts/setup.mjs bootstrap 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -q "not on PATH"
          echo "$output" | grep -q "pnpm setup --force"
