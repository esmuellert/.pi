# Listed explicitly: pi also loads loose *.ts files from this directory that
# other tools install, and those must not be treated as workspace packages.
packages:
  - "responsive-footer"
  - "cd"
  - "themes"
  - "tool-blocks"
  - "moshi-push"
  - "rename"
  - "response-footer"
  # Shared by the packages that draw, so "fast enough" means the same thing in
  # each of them and is measured the same way.
  - "wheel"
  - "behind"
  - "frame-budget"

# Single source of truth for tooling versions. Packages reference "catalog:".
catalog:
  # Pinned to the pi we build against. When `pnpm contract` reports that the
  # installed pi differs, bump this, reinstall, and re-run `pnpm verify`.
  "@earendil-works/pi-ai": 0.84.4
  "@earendil-works/pi-coding-agent": 0.84.4
  "@earendil-works/pi-tui": 0.84.4
  # Upstream palettes, so "official" is enforced by the dependency graph
  # rather than by transcription. Bumping these can change theme output.
  "@catppuccin/palette": ^1.8.0
  "@rose-pine/palette": ^4.0.1
  # VS Code's tokeniser. Its shell grammar is the only one measured here
  # that recognises command names, options, operators and heredoc bodies.
  "@shikijs/langs": ^4.4.3
  "@shikijs/themes": ^4.4.3
  shiki: ^4.4.3
  "@types/node": ^26.2.0
  turbo: ^2.10.11
  typescript: ^7.0.2

# Whichever platform is installing, and no others. turbo and TypeScript 7 ship
# one native binary per platform as optional dependencies; without this pnpm
# unpacks all of them, which was 770 MB of Windows, Linux, AIX and s390x builds
# against the 66 MB that can actually run.
#
# `current` rather than a named platform: pinning darwin/arm64 made the repo
# installable on one machine and broken on every other, which is what a config
# repo cannot be. A Windows or Linux checkout resolves its own binaries here.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
